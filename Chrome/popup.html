<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <style>
    body { width: 360px; margin: 0; padding: 14px; font: 13px/1.5 system-ui, sans-serif; }
    h1 { font-size: 14px; margin: 0 0 10px; }
    .row { display: flex; align-items: center; gap: 10px; }
    input[type="range"] { flex: 1; }
    #value { width: 40px; text-align: right; font-variant-numeric: tabular-nums; }
    .hint { display: flex; justify-content: space-between; color: #666; font-size: 11px; margin-top: 2px; }
    p { color: #555; font-size: 12px; margin: 10px 0; }
    button { padding: 4px 10px; }
    hr { margin: 14px 0; border: 0; border-top: 1px solid #ddd; }
    textarea { width: 100%; height: 150px; box-sizing: border-box; resize: vertical; font: inherit; padding: 6px; }
    .bar { display: flex; align-items: center; gap: 8px; margin-top: 6px; }
    #copyStatus { color: #2a7; font-size: 12px; }

    /* オン/オフのスイッチ */
    .switch { display: flex; align-items: center; justify-content: space-between; gap: 10px; cursor: pointer; }
    .switch input { position: absolute; opacity: 0; pointer-events: none; }
    .switch .track { flex: none; position: relative; width: 36px; height: 20px; border-radius: 10px; background: #bbb; transition: background .15s; }
    .switch .track::after { content: ""; position: absolute; top: 2px; left: 2px; width: 16px; height: 16px; border-radius: 50%; background: #fff; transition: transform .15s; }
    .switch input:checked + .track { background: #2a7; }
    .switch input:checked + .track::after { transform: translateX(16px); }
    .switch input:focus-visible + .track { outline: 2px solid #2a7; outline-offset: 2px; }
    .master { padding: 10px 12px; border-radius: 8px; background: #f2f2f2; font-weight: bold; font-size: 14px; }
    .master .state { font-weight: normal; font-size: 12px; color: #666; margin-left: 6px; }

    /* 整形オフのときは整形の設定を薄くする（メモ帳はそのまま使える） */
    #formatSettings.off { opacity: .45; }
  </style>
</head>
<body>
  <label class="switch master">
    <span>整形ペースト<span class="state" id="enabledState"></span></span>
    <input type="checkbox" id="enabled">
    <span class="track"></span>
  </label>
  <p>オフにすると Ctrl+V でもココフォリア標準の貼り付けになります。</p>

  <div id="formatSettings">
    <hr>
    <h1>改行を残す行の長さ</h1>
    <div class="row">
      <input type="range" id="slider" min="0.5" max="1" step="0.01">
      <span id="value"></span>
    </div>
    <div class="hint"><span>0.5：繋がりやすい</span><span>1.0：改行が残りやすい</span></div>
    <p>PDFの折り返し幅（いちばん多くの行がそろっている長さ）に対して、この割合より短い行の後ろでは改行を残します。変更は即座に反映されます。</p>
    <button id="reset">初期値（0.80）に戻す</button>

    <hr>
    <label class="switch">
      <span>見出しの後に空行を入れる</span>
      <input type="checkbox" id="headingBlankLine">
      <span class="track"></span>
    </label>
    <p>オンなら見出しと本文の間を1行空け、オフなら改行だけにします。</p>

    <label class="switch">
      <span>日本語中の不要な半角スペースを削除</span>
      <input type="checkbox" id="removeSpaces">
      <span class="track"></span>
    </label>
    <p>PDFやOCR由来の「貼り 付け」のようなスペースを消します。英文の単語間のスペースはそのまま残します。</p>
  </div>

  <hr>
  <h1>メモ帳</h1>
  <textarea id="memo" placeholder="ここに貼り付けて、手直ししたりコピーしたりできます。"></textarea>
  <div class="bar">
    <button id="copy">コピー</button>
    <button id="clear">クリア</button>
    <span id="copyStatus"></span>
  </div>
  <p>ここでは整形されず、そのまま貼り付けられます。ココフォリアに戻すときは Ctrl+Shift+V で貼り付けてください。</p>
  <script src="popup.js"></script>
</body>
</html>
